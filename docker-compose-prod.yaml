version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development 
    environment:
      NODE_ENV: production 
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_HOST: db
    networks:
      - private 
      - public 
    depends_on:
      db:
        condition: service_healthy
    restart: always 

  db: 
    image: mariadb:10.6.4-focal 
    command: '--default-authentication-plugin=mysql_native_password'
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --password=$$(cat /run/secrets/db-password) --silent"]
      interval: 30s
      retries: 5
      start_period: 30s
    secrets:
      - db-password
    networks:
      - private 

  
  frontend:
    build:
      context: ./frontend
      target: development 
    networks:
      - public 
    ports:
      - "3000:3000" 
    depends_on:
      - backend 
    restart: always


networks:
  public:  
  private: 


volumes:
  db-data:

secrets:
  db-password:
    file: ./db/password.txt
